plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.fakeshutdown'
version = '1.0.0'

android {
    namespace "expo.modules.fakeshutdown"
    defaultConfig {
        minSdk 24
        versionCode 1
        versionName "1.0.0"
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.apkupdater'
version = '1.0.0'

android {
    namespace "expo.modules.apkupdater"
    defaultConfig {
        minSdk 24
        versionCode 1
        versionName "1.0.0"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
}
